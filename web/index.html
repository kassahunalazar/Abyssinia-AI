<!doctype html>
<html lang="am">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abyssinia AI</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside id="sidebar" aria-label="የውይይት ዝርዝር">
    <div class="brand"><span class="brand-mark" aria-hidden="true">አ</span> Abyssinia AI</div>
    <button class="nav-button" id="new-chat"><span class="nav-icon" aria-hidden="true">+</span> አዲስ ውይይት</button>
    <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="ውይይት ፈልግ" placeholder="ውይይት ፈልግ"></label>
    <div class="history">
      <h2>ውይይቶች</h2>
      <p id="empty-history">እስካሁን ውይይት የለም</p>
      <div id="chat-list"></div>
    </div>
    <div class="sidebar-footer"><span class="dot" aria-hidden="true"></span> በዚህ ኮምፒውተር</div>
  </aside>
  <main>
    <header class="topbar">
      <button id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="የጎን ማውጫ">☰</button>
      <span id="chat-title"></span>
    </header>
    <div class="workspace" id="workspace">
      <section class="welcome" id="welcome" aria-labelledby="welcome-title">
        <h1 id="welcome-title">ሰላም፣ ዛሬ ምን ልርዳዎት?</h1>
        <div class="agent-strip"><span><b aria-hidden="true">አ</b> Abyssinia AI</span></div>
      </section>
      <section id="messages" role="log" aria-label="ውይይት" hidden></section>
      <form id="composer">
        <div class="input-panel">
          <label class="sr-only" for="message">መልዕክትዎን ይጻፉ</label>
          <textarea id="message" rows="2" maxlength="4000" placeholder="ለአቢሲኒያ AI መልዕክት ይጻፉ…" required></textarea>
          <div class="composer-actions">
            <span id="status" role="status"></span>
            <span class="engine">Abyssinia AI</span>
            <button id="send" type="submit" aria-label="ላክ" title="ላክ" disabled>↑</button>
          </div>
        </div>
        <div class="composer-footer">የጽሑፍ ውይይት</div>
      </form>
      <section id="suggestions" aria-labelledby="suggestions-title">
        <h2 id="suggestions-title">በምሳሌ ይጀምሩ</h2>
        <div class="cards">
          <button type="button" data-prompt="በአዲስ አበባ ለአንድ ቀን የጉብኝት ዕቅድ አዘጋጅልኝ።"><span class="card-icon violet" aria-hidden="true">↗</span><span><strong>ዕቅድ አውጣ</strong><small>የጉብኝት ዕቅድ አዘጋጅ</small></span></button>
          <button type="button" data-prompt="ለሥራ ባልደረባዬ አጭር የምስጋና መልዕክት ጻፍልኝ።"><span class="card-icon coral" aria-hidden="true">✎</span><span><strong>ጽሑፍ አዘጋጅ</strong><small>የምስጋና መልዕክት ጻፍ</small></span></button>
          <button type="button" data-prompt="የኢትዮጵያን የቀን አቆጣጠር በቀላሉ አስረዳኝ።"><span class="card-icon blue" aria-hidden="true">◷</span><span><strong>አንድ ነገር ተማር</strong><small>የቀን አቆጣጠርን ተረዳ</small></span></button>
          <button type="button" data-prompt="‘Thank you for taking the time to meet with me’ ወደ ተፈጥሯዊ አማርኛ ተርጉም።"><span class="card-icon green" aria-hidden="true">ሀ</span><span><strong>ተርጉም</strong><small>ከእንግሊዝኛ ወደ አማርኛ</small></span></button>
          <button type="button" data-prompt="ለአካባቢያዊ የቡና ንግድ አምስት አጭር ስሞች ጠቁመኝ።"><span class="card-icon gold" aria-hidden="true">✦</span><span><strong>ሐሳብ አመንጭ</strong><small>ለቡና ንግድ ስም ፈልግ</small></span></button>
          <button type="button" data-prompt="በPython ውስጥ list እና tuple ያላቸውን ልዩነት በአማርኛ ግለጽ።"><span class="card-icon gray" aria-hidden="true">‹›</span><span><strong>ኮድ ተረዳ</strong><small>የPython ምሳሌ ተመልከት</small></span></button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
