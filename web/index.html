<!doctype html>
<html lang="am">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>የአማርኛ ረዳት</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header><h1>የአማርኛ ረዳት</h1></header>
    <section id="messages" role="log" aria-label="ውይይት"></section>
    <form>
      <label for="message">መልዕክትዎን ይጻፉ</label>
      <textarea id="message" rows="3" maxlength="4000" required></textarea>
      <div><button type="submit">ላክ</button><span id="status" role="status"></span></div>
    </form>
  </main>
</body>
</html>
